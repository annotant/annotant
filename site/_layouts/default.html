<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="{{ page.root }}assets/annotant.png" />
    <link rel="stylesheet" href="{{ page.root }}assets/site.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to the content</a>
    <header class="bar">
      <a class="brand" href="{{ page.root | default: './' }}">
        <img src="{{ page.root }}assets/annotant.png" alt="" width="28" height="21" />
        <span>Annot<span class="brand-accent">ant</span></span>
      </a>
      <nav aria-label="Site">
        <a href="{{ page.root }}docs/">Docs</a>
        <a href="https://github.com/annotant/annotant">GitHub</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="foot">
      <p>
        <a href="https://github.com/annotant/annotant/blob/main/LICENSE">MIT</a> © Kevin
        Manson. Annotant is an independent open source project, not affiliated with,
        endorsed by or supported by Anthropic. Claude and Claude Code are trademarks of
        Anthropic, PBC.
      </p>
    </footer>
  </body>
</html>
