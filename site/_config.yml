# Built by .github/workflows/pages.yml from what .github/scripts/site.mjs stages:
# this folder, and the docs pages made from the repository's Markdown.
title: Annotant
description: Comment on your running app. Claude makes the change.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  toc_levels: 2..3
# site.mjs already points the links at the pages, relatively so the site works
# at any address: the plugin would redo it.
relative_links:
  enabled: false
# PostHog counts the visits (_layouts/default.html) once `key` is set, in the
# "Sites" project shared with other websites, told apart by $host. The key is
# public by design; without one, the pages load nothing. Keep on in its
# settings "Cookieless tracking" (or PostHog drops every event), "Discard client
# IP data" (no IP is stored) and "Filter out internal and test users" with
# `internal` is not true (previews and the owner's visits).
posthog:
  key: phc_qBYkHwroRva6PuupZSB6n2XyW7BiYRF3g2LFiAS2eBQg
  host: https://us.i.posthog.com
