# Built by .github/workflows/pages.yml from what .github/scripts/site.mjs stages:
# this folder, and the docs pages made from the repository's Markdown.
title: Annotant
description: Comment on your running app. Claude makes the change.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  toc_levels: 2..3
# site.mjs already points the links at the pages, relatively so the site works
# at any address: the plugin would redo it.
relative_links:
  enabled: false
