name: Release

# Manual only: Actions → Release → Run workflow, on main. See CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, x.y.z; must match .claude-plugin/plugin.json
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read # count the open code scanning alerts
    env:
      CLAUDE_CODE_VERSION: 2.1.284
      VERSION: ${{ inputs.version }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags, to compare with the released versions

      - name: Pin the commit to release
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the version, tag and changelog
        run: node .github/scripts/release-check.mjs "$VERSION" "$RUNNER_TEMP/notes.md"

      - name: Install
        run: npm ci

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: No known vulnerability in dependencies
        run: npm audit --audit-level=low

      - name: Format, lint, type-check and build
        run: npm run check

      # Scorecard's alerts rate the project's practices, not its code: they do not block.
      - name: No open code scanning alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | select(.tool.name != "Scorecard") | "\(.tool.name) #\(.number) \(.rule.id) \(.html_url)"')
          if [ -n "$open" ]; then
            echo "$open"
            echo "::error::open code scanning alerts: fix or dismiss them before releasing."
            exit 1
          fi

      - name: Install Claude Code
        # Deliberately outside the lockfile: a 220 MB tool CI alone needs, pinned above.
        run: | # zizmor: ignore[adhoc-packages]
          npm install --prefix "$RUNNER_TEMP/claude" --no-save --no-audit --ignore-scripts \
            "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          node "$RUNNER_TEMP/claude/node_modules/@anthropic-ai/claude-code/install.cjs"

      - name: Validate the plugin and marketplace manifests
        run: '"$RUNNER_TEMP/claude/node_modules/.bin/claude" plugin validate .'

      - name: Stage the built widget and the release notes
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release/notes.md"
          cp -R skills/annotant/widget/dist "$RUNNER_TEMP/release/dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish to stable
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Waits for a maintainer's approval in the "release" environment.
    environment: release
    permissions:
      contents: write # push the stable branch, create the tag and the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # stable = the verified commit plus its built widget. Its parents are the previous
      # stable commit (so the push fast-forwards) and the verified commit on main.
      - name: Build the stable commit and the plugin archive
        id: stable
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf skills/annotant/widget/dist
          cp -R "$RUNNER_TEMP/release/dist" skills/annotant/widget/dist
          git add --force skills/annotant/widget/dist
          parents=(-p "$SHA")
          if git ls-remote --exit-code --heads origin stable > /dev/null; then
            git fetch --quiet origin stable
            parents=(-p FETCH_HEAD "${parents[@]}")
          fi
          commit=$(git commit-tree "$(git write-tree)" "${parents[@]}" \
            -m "release: v$VERSION" -m "Built from $SHA on main.")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz --prefix="annotant-$VERSION/" \
            -o "$RUNNER_TEMP/annotant-$VERSION.tar.gz" "$commit"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: ${{ runner.temp }}/annotant-${{ inputs.version }}.tar.gz

      # The attestation also ships as a release asset, which Scorecard's Signed-Releases
      # counts as provenance by its .intoto.jsonl name. Same check as README.md documents.
      - name: Stage and verify the provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/annotant-$VERSION.intoto.jsonl"
          gh attestation verify "$RUNNER_TEMP/annotant-$VERSION.tar.gz" \
            --bundle "$RUNNER_TEMP/annotant-$VERSION.intoto.jsonl" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Push stable
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.stable.outputs.commit }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$COMMIT:refs/heads/stable"

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.stable.outputs.commit }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP/annotant-$VERSION.tar.gz" \
            "$RUNNER_TEMP/annotant-$VERSION.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --title "Annotant $VERSION" --notes-file "$RUNNER_TEMP/release/notes.md"
