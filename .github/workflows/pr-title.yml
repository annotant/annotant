name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Check title
    # Dependabot writes its own titles ("chore(deps): Bump …"); a skipped job still
    # satisfies the required check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the pull request's title
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      # The title becomes the squashed commit message: see CONTRIBUTING.md.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feature
            fix
            docs
            chore
            refactor
            perf
            test
            ci
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >-
            The summary "{subject}" must start with a lowercase letter and not end
            with a period, e.g. "fix: keep the panel above modal dialogs".
